spring:
  application:
    name: laboratorio-jpa-h2
datasource:
  url: jdbc:h2:mem:laboratoriodb;DB_CLOSE_DELAY=-1
  driverClassName: org.h2.Driver
  username: sa
  password: ""
h2:
  console:
    enabled: true
    path: /h2-console
jpa:
  show-sql: true
  hibernate:
    ddl-auto: create-drop
  properties:
    hibernate:
      format_sql: true
